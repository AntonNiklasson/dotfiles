gui:
  nerdFontsVersion: "3"
  showListFooter: false
  showPanelJumps: false
  statusPanelView: allBranchesLog
  truncateListItem: true
  expandFocusedSidePanel: false
  sidePanelWidth: 0.4
  theme:
    selectedLineBgColor:
      - reverse
git:
  diffRenderers:
    # delta options live in ~/.gitconfig under [delta "lazygit"]; cycle with `|`
    - command: delta --dark --paging=never --features=lazygit
    - command: delta --dark --paging=never --features=lazygit-side-by-side
os:
  editPreset: nvim
  openDirInEditorTemplate: cursor -- {{dir}}
customCommands:
  - key: "<c-p>"
    context: "localBranches"
    description: "Create a pull request"
    loadingText: "Preparing PR ⏳"
    command: "gh pr create --fill --web"
