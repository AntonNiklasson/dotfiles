onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[ui]
tab_bar_position = "top"
pane_borders = true
pane_gaps = false
sidebar_collapsed_mode = "hidden"

agent_panel_sort = "spaces"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "system"

[experimental]
pane_history = false
kitty_graphics = true

[keys]
prefix = "ctrl+a"
copy_mode = "prefix+["
new_tab = ["prefix+t", "prefix+c"]
previous_tab = "prefix+tab"
rename_tab = "prefix+,"
rename_workspace = "prefix+r"
reload_config = "prefix+shift+r"
last_pane = "prefix+p"
close_pane = "prefix+x"
close_tab = "prefix+shift+w"
close_workspace = "prefix+shift+x"
edit_scrollback = "prefix+e"
split_horizontal = "prefix+b"
toggle_sidebar = "prefix+]"

resize_mode = "prefix+shift+s"

navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]

switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+space"
type = "popup"
width = "30%"
height = "30%"
description = "workspace picker"
command = "$HOME/.dotfiles/bin/session"

[[keys.command]]
key = "prefix+u"
type = "popup"
width = "60%"
height = "40%"
description = "pick url from pane"
command = "$HOME/.dotfiles/bin/pick-url"

[[keys.command]]
key = "prefix+a"
type = "popup"
width = "70%"
height = "50%"
description = "agent picker"
command = "$HOME/.dotfiles/bin/agents"
