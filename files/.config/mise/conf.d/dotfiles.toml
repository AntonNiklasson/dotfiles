# symlinks into $HOME. existing real files block the run; pass --force-dotfiles
# (needed for ~/.claude/settings.json, which claude code sometimes rewrites).
[dotfiles]
"~/.zshrc" = "~/.dotfiles/files/.zshrc"
"~/.gitconfig" = "~/.dotfiles/files/.gitconfig"
"~/.gitignore" = "~/.dotfiles/files/.gitignore"
"~/.hushlogin" = "~/.dotfiles/files/.hushlogin"
"~/AGENTS.md" = "~/.dotfiles/files/_AGENTS.md"
"~/.config/*" = "~/.dotfiles/files/.config/*"
"~/.config/.DS_Store" = { mode = "absent" } # glob matches dotfiles too
"~/.claude/settings.json" = "~/.dotfiles/files/.claude/settings.json"
"~/.claude/keybindings.json" = "~/.dotfiles/files/.claude/keybindings.json"
"~/.claude/CLAUDE.md" = "~/.dotfiles/files/_AGENTS.md"
"~/.claude/skills" = "~/.dotfiles/skills"
"~/.agents/skills" = "~/.dotfiles/skills"

[bootstrap.hooks]
# drop dead links into the repo (what dotbot's `clean` did)
post-dotfiles = 'find ~ ~/.config -maxdepth 1 -type l -lname "$HOME/.dotfiles/*" ! -exec test -e {} ";" -print -delete'
