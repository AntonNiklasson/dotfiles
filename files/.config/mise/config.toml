# global tools. brew (Brewfile) keeps casks, mas, shell plumbing, and
# formulae with no prebuilt binary in the mise registry.

[tools]
# runtimes
node = "24"
bun = "latest"
pnpm = "latest"
"npm:zx" = "latest"

# nav / view
bat = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
zoxide = "latest"
yazi = "latest"
glow = "latest"
tlrc = "latest"
bottom = "latest"
"npm:diff-so-fancy" = "latest"

# git
gh = "latest"
delta = "latest"
lazygit = "latest"

# editor
neovim = "latest"

# dev misc
jq = "latest"
direnv = "latest"
"aqua:anomalyco/opencode" = "latest"

# infra
k9s = "latest"
lazydocker = "latest"

[settings]
# read .nvmrc / .node-version like fnm did
idiomatic_version_file_enable_tools = ["node"]
