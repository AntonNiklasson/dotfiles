# global mise config, also what `mise bootstrap` runs from (see README).
# bootstrap parts live in conf.d/*.toml, loaded after this file.
# [tools]: CLI tools + runtimes. brew formulae only for what has no prebuilt
# binary in the mise registry (see [bootstrap.packages]).

[tools]
# runtimes
node = "24"
bun = "latest"
pnpm = "latest"
"npm:zx" = "latest"

# nav / view
bat = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
zoxide = "latest"
yazi = "latest"
glow = "latest"
tlrc = "latest"
bottom = "latest"
"npm:diff-so-fancy" = "latest"

# git
gh = "latest"
delta = "latest"
lazygit = "latest"

# editor
neovim = "latest"

# dev misc
jq = "latest"
direnv = "latest"
"aqua:anomalyco/opencode" = "latest"

# infra
k9s = "latest"
lazydocker = "latest"

[settings]
# read .nvmrc / .node-version like fnm did
idiomatic_version_file_enable_tools = ["node"]
# gh keeps its token in the keychain, not hosts.yml, so mise can't find it on
# its own. without a token we share zscaler's egress IP's 60 req/h limit.
github.credential_command = "gh auth token"
# `mise bootstrap packages use -g` writes here, not to this file
write_targets.packages = "~/.config/mise/conf.d/packages.toml"
