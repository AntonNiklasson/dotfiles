# global mise config, also what `mise bootstrap` runs from (see README).
# [tools]: CLI tools + runtimes. brew formulae only for what has no prebuilt
# binary in the mise registry (see [bootstrap.packages]).

[tools]
# runtimes
node = "24"
bun = "latest"
pnpm = "latest"
"npm:zx" = "latest"

# nav / view
bat = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
zoxide = "latest"
yazi = "latest"
glow = "latest"
tlrc = "latest"
bottom = "latest"
"npm:diff-so-fancy" = "latest"

# git
gh = "latest"
delta = "latest"
lazygit = "latest"

# editor
neovim = "latest"

# dev misc
jq = "latest"
direnv = "latest"
"aqua:anomalyco/opencode" = "latest"

# infra
k9s = "latest"
lazydocker = "latest"

[settings]
# read .nvmrc / .node-version like fnm did
idiomatic_version_file_enable_tools = ["node"]
# gh keeps its token in the keychain, not hosts.yml, so mise can't find it on
# its own. without a token we share zscaler's egress IP's 60 req/h limit.
github.credential_command = "gh auth token"

# ---------------------------------------------------------------------------
# bootstrap: `mise bootstrap` installs packages, links dotfiles, applies
# macos defaults, then installs [tools]. preview with `mise bootstrap --dry-run`.
# ---------------------------------------------------------------------------

# homebrew formulae + casks. mise installs these itself into
# /opt/homebrew; brew CLI still works on them.
[bootstrap.packages]
# shell
"brew:bash" = "latest"
"brew:zsh" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-completions" = "latest"
"brew:zsh-vi-mode" = "latest"
"brew:coreutils" = "latest"
"brew:gnu-sed" = "latest"
"brew:curl" = "latest"
"brew:mise" = "latest"

# nav / view (yazi itself is in [tools]; these are its preview deps)
"brew:eza" = "latest"
"brew:the_silver_searcher" = "latest"
"brew:tree" = "latest"
"brew:chafa" = "latest"    # yazi image preview fallback
"brew:ffmpeg" = "latest"   # yazi video/gif thumbnails
"brew:poppler" = "latest"  # yazi pdf previews
"brew:sevenzip" = "latest" # yazi archive preview/extract
"brew:exiftool" = "latest" # yazi image metadata

# git
"brew:git" = "latest"
"brew:git-extras" = "latest"
"brew:git-trim" = "latest"

# editor / terminal
"brew:vim" = "latest"
"brew:tmux" = "latest"
"brew:luarocks" = "latest"

# dev misc
"brew:httpie" = "latest"
"brew:cormacrelf/tap/dark-notify" = "latest"
"brew:dhth/tap/prs" = "latest"
"brew:blueutil" = "latest"
"brew:displayplacer" = "latest"
"brew:terminal-notifier" = "latest"

# infra / db (docker CLI comes from docker-desktop)
"brew:docker-compose" = "latest"
"brew:flyway" = "latest"

# apps
"brew-cask:1password" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:caffeine" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:dropbox" = "latest"
"brew-cask:gcloud-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:hiddenbar" = "latest"
"brew-cask:leader-key" = "latest"
"brew-cask:linear-linear" = "latest"
"brew-cask:logitech-options" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:postico" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:todoist-app" = "latest"
"brew-cask:tuple" = "latest"
"brew-cask:zen" = "latest"

# fonts
"brew-cask:font-geist-mono-nerd-font" = "latest"

# symlinks into $HOME. existing real files block the run; pass --force-dotfiles
# (needed for ~/.claude/settings.json, which claude code sometimes rewrites).
[dotfiles]
"~/.zshrc" = "~/.dotfiles/files/.zshrc"
"~/.gitconfig" = "~/.dotfiles/files/.gitconfig"
"~/.gitignore" = "~/.dotfiles/files/.gitignore"
"~/.hushlogin" = "~/.dotfiles/files/.hushlogin"
"~/AGENTS.md" = "~/.dotfiles/files/_AGENTS.md"
"~/.config/*" = "~/.dotfiles/files/.config/*"
"~/.config/.DS_Store" = { mode = "absent" } # glob matches dotfiles too
"~/.claude/settings.json" = "~/.dotfiles/files/.claude/settings.json"
"~/.claude/keybindings.json" = "~/.dotfiles/files/.claude/keybindings.json"
"~/.claude/CLAUDE.md" = "~/.dotfiles/files/_AGENTS.md"
"~/.claude/skills" = "~/.dotfiles/skills"
"~/.agents/skills" = "~/.dotfiles/skills"

# macos defaults. type follows the TOML value (int/bool/string). mise doesn't
# restart apps: `killall Dock Finder SystemUIServer` or log out to see changes.
[bootstrap.macos.defaults."com.apple.dock"]
autohide-time-modifier = 0
mru-spaces = 0

[bootstrap.macos.defaults.NSGlobalDomain]
NSNavPanelExpandedStateForSaveMode = true
AppleKeyboardUIMode = 3
ApplePressAndHoldEnabled = false

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadThreeFingerDrag = true

[bootstrap.macos.defaults."com.apple.finder"]
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults."com.apple.screencapture"]
show-thumbnail = false

[bootstrap.hooks]
# screenshot dir needs $HOME, which defaults values don't expand
post-defaults = '''
dir="$HOME/Library/Mobile Documents/com~apple~CloudDocs/Screenshots"
mkdir -p "$dir"
[ "$(defaults read com.apple.screencapture location 2>/dev/null)" = "$dir" ] || defaults write com.apple.screencapture location "$dir"
'''
# drop dead links into the repo (what dotbot's `clean` did)
post-dotfiles = 'find ~ ~/.config -maxdepth 1 -type l -lname "$HOME/.dotfiles/*" ! -exec test -e {} ";" -print -delete'

# node deps for the zx scripts in bin/ (wt, rr, copylast, list-tmux-windows)
post-tools = "cd ~/.dotfiles/bin && mise exec -- pnpm install --frozen-lockfile"

# herdr: installer, not brew/mise. a stale packaged copy earlier on PATH than
# ~/.local/bin breaks every CLI call with a protocol_mismatch. herdr updates itself.
final = '''
if [ -x "$HOME/.local/bin/herdr" ]; then
  "$HOME/.local/bin/herdr" update
else
  curl -fsSL https://herdr.dev/install.sh | sh
fi
'''
