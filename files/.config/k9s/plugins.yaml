plugins:
  # Ephemeral debug container sharing the target container's process namespace
  debug:
    shortCut: Shift-D
    description: Debug container
    scopes:
      - containers
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - kubectl debug -it --context $CONTEXT -n $NAMESPACE $POD --target=$NAME --image=nicolaka/netshoot:latest --share-processes -- bash
