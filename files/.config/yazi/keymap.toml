# Additions on top of yazi's defaults; `prepend_keymap` merges rather than replaces.
# Defaults already cover: z=fzf, Z=zoxide, c{c,d,f,n}=copy paths, ;/:=shell.

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directory, or open file"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview"

[[mgr.prepend_keymap]]
on = "<C-n>"
run = 'shell -- open -R "$0"'
desc = "Reveal in Finder"

[[mgr.prepend_keymap]]
on = "!"
run = 'shell "$SHELL" --block'
desc = "Shell here"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to repo root"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.dotfiles"
desc = "Go to ~/.dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/code"
desc = "Go to ~/code"
