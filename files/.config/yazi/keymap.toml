# Additions on top of yazi's defaults; `prepend_keymap` merges rather than replaces.
# Defaults already cover: z=fzf, Z=zoxide, c{c,d,f,n}=copy paths, ;/:=shell.

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directory, or open file"

[[mgr.prepend_keymap]]
on = "F"
run = "filter --smart"
desc = "Filter files (smart case)"

[[mgr.prepend_keymap]]
on = "q"
run = "plugin autosession -- save-and-quit"
desc = "Save session and quit"

[[mgr.prepend_keymap]]
on = ["u", "a"]
run = "plugin yamb -- save"
desc = "Bookmark hovered file or directory"

[[mgr.prepend_keymap]]
on = ["u", "g"]
run = "plugin yamb -- jump_by_key"
desc = "Jump to bookmark by key"

[[mgr.prepend_keymap]]
on = ["u", "G"]
run = "plugin yamb -- jump_by_fzf"
desc = "Search bookmarks"

[[mgr.prepend_keymap]]
on = ["u", "d"]
run = "plugin yamb -- delete_by_key"
desc = "Delete bookmark"

[[mgr.prepend_keymap]]
on = "<C-n>"
run = 'shell -- open -R "$0"'
desc = "Reveal in Finder"

[[mgr.prepend_keymap]]
on = "!"
run = 'shell "$SHELL" --block'
desc = "Shell here"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to repo root"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.dotfiles"
desc = "Go to ~/.dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/code"
desc = "Go to ~/code"
